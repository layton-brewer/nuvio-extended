name: Windows build

# Builds the Meowio Windows app (EXE installer) from the Nuvio Desktop sources with the Meowio overlay applied,
# then attaches it to the latest Meowio release so every download lives on one page.
on:
  push:
    branches: [main, claude/project-thread-gdrsat]
    paths:
      - "windows/**"
      - "apple/macos/**"
      - "mobile/composeApp/src/commonMain/**"
      - "mobile/composeApp/src/fullCommonMain/**"
      - ".github/workflows/windows.yml"
  # Pull requests build the EXE as a compile check; only main attaches it to the release.
  pull_request:
    paths:
      - "windows/**"
      - "apple/macos/**"
      - "mobile/composeApp/src/commonMain/**"
      - "mobile/composeApp/src/fullCommonMain/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

env:
  # Builds attach to this release page. Bump together with the version numbers below and the tag in release.yml.
  MEOWIO_TAG: v0.2.12

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exe:
    name: Build Windows EXE (x64)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch desktop sources
        shell: bash
        run: |
          # Pinned so the Meowio overlay always lands on the sources it was merged against.
          export GIT_LFS_SKIP_SMUDGE=1
          git init desktop
          cd desktop
          git remote add origin https://github.com/NuvioMedia/NuvioDesktop.git
          git fetch --depth 1 origin fca444b96ea03251fb21dc46ac5de035d3358806
          git checkout --force FETCH_HEAD
          unset GIT_LFS_SKIP_SMUDGE
          git lfs install --local
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          size="$(wc -c < composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll)"
          echo "libmpv-2.dll is $size bytes"
          test "$size" -gt 1000000

      - name: Apply Meowio branding and overlay
        shell: bash
        run: ./apple/macos/apply-overlay.sh desktop

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache
          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          if (-not (Test-Path (Join-Path $webView2Root "build\native\x64\WebView2Loader.dll.lib"))) {
            throw "WebView2 SDK was not found at $webView2Root"
          }
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build EXE
        working-directory: desktop
        shell: pwsh
        env:
          # Same optional account server as the phone and iPhone builds; empty when the secrets are not set.
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        run: |
          "NUVIO_SUPABASE_URL=$env:NUVIO_SUPABASE_URL`nNUVIO_SUPABASE_ANON_KEY=$env:NUVIO_SUPABASE_ANON_KEY`nTRAKT_CLIENT_ID=`nTRAKT_CLIENT_SECRET=`nMDBLIST_CLIENT_ID=`n" | Set-Content local.properties -NoNewline
          & .\gradlew.bat `
            :composeApp:packageReleaseExe `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            "-Pnuvio.desktop.versionName=0.2.12" `
            --no-configuration-cache `
            --no-daemon `
            --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect EXE
        shell: bash
        run: |
          mkdir -p out
          exe="$(find desktop/composeApp/build -path "*main-release/exe/*" -name "*.exe" | head -n 1)"
          echo "Found: $exe"
          test -n "$exe"
          cp "$exe" out/Meowio-windows-x64.exe
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Meowio-windows-x64
          path: out/Meowio-windows-x64.exe
          retention-days: 14

      - name: Attach to this version's Meowio release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Wait for this version's release page (the Android build creates it), then attach.
          for i in $(seq 1 40); do gh release view "$MEOWIO_TAG" >/dev/null 2>&1 && break; sleep 60; done
          for i in 1 2 3 4; do gh release upload "$MEOWIO_TAG" out/Meowio-windows-x64.exe --clobber && exit 0; sleep 30; done
          exit 1
