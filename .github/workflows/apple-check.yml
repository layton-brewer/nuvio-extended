name: Apple compile check

# Fast compile-only checks for Apple work in progress. Publishing is done by apple.yml on main.
on:
  push:
    branches: ["claude/project-thread-87zvur", "claude/project-thread-gdrsat", "claude/project-thread-f2h6wb"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Compile Mac app sources (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch desktop sources
        run: |
          git init desktop
          cd desktop
          git remote add origin https://github.com/NuvioMedia/NuvioDesktop.git
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth 1 origin fca444b96ea03251fb21dc46ac5de035d3358806
          GIT_LFS_SKIP_SMUDGE=1 git checkout --force FETCH_HEAD
      - name: Apply Meowio overlay
        run: ./apple/macos/apply-overlay.sh desktop
      - name: Compile
        working-directory: desktop
        run: |
          printf 'NUVIO_SUPABASE_URL=\nNUVIO_SUPABASE_ANON_KEY=\nTRAKT_CLIENT_ID=\nTRAKT_CLIENT_SECRET=\nMDBLIST_CLIENT_ID=\n' > local.properties
          ./gradlew :composeApp:compileKotlinDesktop -x :composeMediaPlayer:buildNativeLinux --no-daemon --no-configuration-cache --max-workers=2 --continue

  tvos:
    name: Compile Apple TV app
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tvos
    steps:
      - uses: actions/checkout@v4
      - name: Fetch MPVKit
        run: git init -q MPVKit && git -C MPVKit fetch -q --depth 1 https://github.com/mpvkit/MPVKit.git d9194243bdc68b87d8989376ab52aee7da6c8e0b && git -C MPVKit checkout -q FETCH_HEAD
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Meowio.xcodeproj -scheme Meowio -configuration Debug \
            -sdk appletvos -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build 2>&1 | grep -E "error:|BUILD|warning: unre" | head -80
