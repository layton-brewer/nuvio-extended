name: Apple builds

on:
  push:
    branches: [main, claude/apple-builds]
    paths:
      - "mobile/iosApp/**"
      - "mobile/composeApp/src/iosMain/**"
      - "mobile/composeApp/src/iosFull/**"
      - "tvos/**"
      - "apple/**"
      - "mobile/composeApp/src/commonMain/**"
      - "mobile/composeApp/src/fullCommonMain/**"
      - ".github/workflows/apple.yml"
  # Pull requests build everything as a compile check; only main attaches files to the release.
  pull_request:
    paths:
      - "mobile/iosApp/**"
      - "mobile/composeApp/src/iosMain/**"
      - "mobile/composeApp/src/iosFull/**"
      - "tvos/**"
      - "apple/**"
      - "mobile/composeApp/src/commonMain/**"
      - "mobile/composeApp/src/fullCommonMain/**"
      - ".github/workflows/apple.yml"
  workflow_dispatch:

env:
  # Builds attach to this release page. Bump together with the version numbers below and the tag in release.yml.
  MEOWIO_TAG: v0.2.12

permissions:
  contents: write

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Check a Meowio release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Apple builds attach to the "Meowio $MEOWIO_TAG" release so every download lives on one
          # page. The upload steps wait for that page if the Android build hasn't created it yet.
          gh release view "$MEOWIO_TAG" --json tagName -q .tagName || echo "$MEOWIO_TAG not published yet; uploads will wait for it"

  ios:
    needs: [release]
    name: Build iOS IPA (unsigned)
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: Debug
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mobile/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Prepare local properties
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        run: |
          touch local.properties
          if [ -n "$NUVIO_SUPABASE_URL" ]; then
            {
              echo "NUVIO_SUPABASE_URL=$NUVIO_SUPABASE_URL"
              echo "NUVIO_SUPABASE_ANON_KEY=$NUVIO_SUPABASE_ANON_KEY"
            } >> local.properties
          fi

      - name: Stamp Meowio version
        # The IPA carries the Meowio version so the in-app update check compares against Meowio releases.
        run: |
          sed -i '' -E "s/^MARKETING_VERSION=.*/MARKETING_VERSION=${MEOWIO_TAG#v}/" iosApp/Configuration/Version.xcconfig
          cat iosApp/Configuration/Version.xcconfig

      - name: Fetch MPVKit
        run: |
          git clone --depth 1 --branch Nuvio https://github.com/NuvioMedia/MPVKit.git MPVKit

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned IPA
        run: ./scripts/build-ios-ipa.sh

      - name: Rename IPA
        run: |
          ipa="$(ls build/ios-ipa/*.ipa | head -n 1)"
          mv "$ipa" build/ios-ipa/Meowio-ios.ipa
          shasum -a 256 build/ios-ipa/Meowio-ios.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Meowio-ios
          path: mobile/build/ios-ipa/Meowio-ios.ipa
          retention-days: 14

      - name: Attach to this version's Meowio release
        # Only main publishes. Other branches keep their build as a workflow artifact.
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Wait for this version's release page (the Android build creates it), then attach.
          for i in $(seq 1 40); do gh release view "$MEOWIO_TAG" >/dev/null 2>&1 && break; sleep 60; done
          for i in 1 2 3 4; do gh release upload "$MEOWIO_TAG" mobile/build/ios-ipa/Meowio-ios.ipa --clobber && exit 0; sleep 30; done
          exit 1

  macos:
    needs: [release]
    name: Build macOS DMG (unsigned, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch desktop sources
        run: |
          brew install git-lfs || true
          git lfs install
          # Pinned so the Meowio overlay always lands on the sources it was merged against.
          git init desktop
          cd desktop
          git remote add origin https://github.com/NuvioMedia/NuvioDesktop.git
          git fetch --depth 1 origin fca444b96ea03251fb21dc46ac5de035d3358806
          git checkout --force FETCH_HEAD
          git lfs pull --include="composeApp/src/desktopMain/native/macos/runtime/${{ matrix.arch }}/**" --exclude=""

      - name: Apply Meowio branding and overlay
        run: ./apple/macos/apply-overlay.sh desktop

      - name: Build DMG
        working-directory: desktop
        env:
          # Same optional account server as the phone and iPhone builds; empty when the secrets are not set.
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        run: |
          printf 'NUVIO_SUPABASE_URL=%s\nNUVIO_SUPABASE_ANON_KEY=%s\nTRAKT_CLIENT_ID=\nTRAKT_CLIENT_SECRET=\nMDBLIST_CLIENT_ID=\n' "$NUVIO_SUPABASE_URL" "$NUVIO_SUPABASE_ANON_KEY" > local.properties
          ./gradlew :composeApp:packageReleaseDmg -Pcompose.desktop.packaging.checkJdkVendor=false -Pnuvio.macos.arch=${{ matrix.arch }} -Pnuvio.desktop.versionName=0.2.12 --no-daemon --no-configuration-cache --max-workers=2
          find composeApp/build -name "*.dmg"

      - name: Collect DMG
        run: |
          mkdir -p out
          dmg="$(find desktop/composeApp/build -name '*.dmg' | head -n 1)"
          cp "$dmg" "out/Meowio-macos-${{ matrix.arch }}.dmg"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Meowio-macos-${{ matrix.arch }}
          path: out/*.dmg
          retention-days: 14

      - name: Attach to this version's Meowio release
        # Only main publishes. Other branches keep their build as a workflow artifact.
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Wait for this version's release page (the Android build creates it), then attach.
          for i in $(seq 1 40); do gh release view "$MEOWIO_TAG" >/dev/null 2>&1 && break; sleep 60; done
          for i in 1 2 3 4; do gh release upload "$MEOWIO_TAG" "out/Meowio-macos-${{ matrix.arch }}.dmg" --clobber && exit 0; sleep 30; done
          exit 1

  tvos:
    needs: [release]
    name: Build tvOS IPA (unsigned)
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tvos
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos || true
          brew install xcodegen

      - name: Fetch MPVKit
        run: git init -q MPVKit && git -C MPVKit fetch -q --depth 1 https://github.com/mpvkit/MPVKit.git d9194243bdc68b87d8989376ab52aee7da6c8e0b && git -C MPVKit checkout -q FETCH_HEAD

      # Account server and Trakt app keys come from repository secrets only (the same ones the Android
      # builds use). Without them the Account page says accounts are off and the Trakt row is hidden.
      - name: Build settings from secrets
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TV_LOCAL_PROPERTIES_BASE64: ${{ secrets.TV_LOCAL_PROPERTIES_BASE64 }}
        run: python3 ../.github/scripts/tvos_build_secrets.py Meowio/BuildSecrets.swift
      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Meowio.xcodeproj -scheme Meowio -configuration Release \
            -sdk appletvos -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            MARKETING_VERSION=0.2.12 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build

      - name: Package IPA
        run: |
          app="build/Build/Products/Release-appletvos/Meowio.app"
          test -d "$app"
          rm -rf pkg && mkdir -p pkg/Payload
          cp -R "$app" pkg/Payload/
          (cd pkg && zip -qry ../Meowio-tvos.ipa Payload)
          shasum -a 256 Meowio-tvos.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Meowio-tvos
          path: tvos/Meowio-tvos.ipa
          retention-days: 14

      - name: Attach to this version's Meowio release
        # Only main publishes. Other branches keep their build as a workflow artifact.
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Wait for this version's release page (the Android build creates it), then attach.
          for i in $(seq 1 40); do gh release view "$MEOWIO_TAG" >/dev/null 2>&1 && break; sleep 60; done
          for i in 1 2 3 4; do gh release upload "$MEOWIO_TAG" tvos/Meowio-tvos.ipa --clobber && exit 0; sleep 30; done
          exit 1
